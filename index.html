<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>潜虚</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23A83A2A'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23F4EAD4' font-family='serif'%3E虚%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;700;900&display=swap">
<style>
/* ===== 基础 ===== */
:root{
  --paper:#EFE5CF;
  --paper2:#E3D5B8;
  --paper3:#F6EEDC;
  --ink:#2B251B;
  --ink2:#6B6150;
  --ink3:#98907E;
  --line:#C9BB9D;
  --cinnabar:#A83A2A;
  --cinnabar2:#C25B3F;
  --water:#2F4F6B;
  --fire:#A83A2A;
  --wood:#4A6B3A;
  --metal:#7C7667;
  --earth:#8F6E33;
  --good:#A83A2A;
  --zang:#4A6B3A;
  --ping:#7A7163;
  --fou:#3E4A5C;
  --xiong:#241F18;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body{
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(168,58,42,.05), transparent 45%),
    radial-gradient(ellipse at 85% 100%, rgba(47,79,107,.05), transparent 45%),
    var(--paper);
  color:var(--ink);
  line-height:1.75;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:660px;margin:0 auto;padding:0 16px 84px}

/* ===== 顶栏 ===== */
header{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:22px 4px 14px;border-bottom:1.5px solid var(--ink);
}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:30px;font-weight:900;letter-spacing:.06em}
.brand .sub{font-size:12px;color:var(--ink2);letter-spacing:.2em}
.seal{
  width:44px;height:44px;background:var(--cinnabar);color:#F4EAD4;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;border-radius:6px;flex:none;letter-spacing:.06em;
  box-shadow:inset 0 0 0 2px rgba(244,234,212,.35);
  cursor:pointer;transition:transform .15s;
}
.seal:active{transform:scale(.94)}
.seal:hover{transform:scale(1.06)}
.tabs{display:flex;gap:18px;margin-top:10px;padding:0 2px}
.tab{
  font-size:14px;color:var(--ink2);cursor:pointer;padding:4px 2px;
  border-bottom:2px solid transparent;letter-spacing:.14em;background:none;border-top:none;border-left:none;border-right:none;
}
.tab.on{color:var(--ink);border-bottom-color:var(--cinnabar);font-weight:700}

/* ===== 视图 ===== */
.view{display:none}
.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 问卦 ===== */
.ask-intro{margin:26px 0 18px;text-align:center}
.ask-intro .ch{font-size:16px;letter-spacing:.3em;color:var(--ink2)}
.ask-intro .big{font-size:44px;font-weight:900;letter-spacing:.12em;margin:8px 0 4px}
.ask-intro .note{font-size:13px;color:var(--ink2);line-height:1.9}
.ask-box{margin:22px 0 10px}
#divine-home{max-width:520px;margin:0 auto;text-align:center;padding-top:24px}
#divine-home .ask-box input{text-align:center}
#divine-home .btn-main{margin-left:auto;margin-right:auto;max-width:260px}
.ask-box label{font-size:13px;color:var(--ink2);letter-spacing:.12em;display:block;margin-bottom:8px}
.ask-box input{
  width:100%;background:var(--paper3);border:1px solid var(--line);
  border-radius:4px;padding:12px 14px;font-size:16px;color:var(--ink);
  font-family:inherit;outline:none;transition:border-color .2s;
}
.ask-box input:focus{border-color:var(--cinnabar)}
.ask-box .hint{font-size:12px;color:var(--ink3);margin-top:6px}
.btn-main{
  display:block;width:100%;padding:16px;margin-top:20px;
  background:var(--ink);color:var(--paper);
  border:none;border-radius:4px;font-family:inherit;
  font-size:17px;font-weight:700;letter-spacing:.3em;cursor:pointer;
  transition:background .2s, transform .1s;
}
.btn-main:active{transform:scale(.985)}
.btn-main.alt{background:var(--cinnabar)}
.btn-main:disabled{opacity:.55;cursor:default;transform:none}
.btn-ghost{
  display:block;width:100%;padding:13px;margin-top:12px;
  background:transparent;color:var(--ink);border:1px solid var(--ink);
  border-radius:4px;font-family:inherit;font-size:15px;font-weight:700;
  letter-spacing:.24em;cursor:pointer;transition:background .2s;
}
.btn-ghost:active{background:rgba(43,37,27,.08)}

.rules{margin-top:26px;border:1px solid var(--line);border-radius:4px;background:rgba(246,238,220,.5)}
.rules summary{
  padding:11px 14px;cursor:pointer;font-size:13px;color:var(--ink2);
  letter-spacing:.14em;list-style:none;user-select:none;
}
.rules summary::before{content:"＋ ";color:var(--cinnabar)}
.rules[open] summary::before{content:"－ "}
.rules .body{padding:2px 16px 14px;font-size:13px;color:var(--ink2);line-height:2}
.rules .body b{color:var(--ink)}

/* ===== 演蓍过程 ===== */
.cast-log{
  margin:20px 0;border:1px solid var(--line);border-radius:4px;
  background:rgba(246,238,220,.45);padding:14px 16px;
}
.cast-log h3{
  font-size:13px;letter-spacing:.2em;color:var(--cinnabar);
  margin-bottom:10px;font-weight:700;
}
.cast-step{display:flex;gap:10px;align-items:baseline;font-size:14px;margin-bottom:8px;color:var(--ink2)}
.cast-step .no{color:var(--cinnabar);font-weight:700;flex:none}
.cast-step .val{color:var(--ink);font-weight:700;white-space:nowrap}
.cast-step.hl{color:var(--ink);font-weight:700}
.cast-step .tag{font-size:11px;background:var(--paper2);border-radius:3px;padding:0 6px;color:var(--ink2);flex:none}
.cast-step.in{opacity:0;transform:translateX(-8px);animation:stepin .4s forwards}
@keyframes stepin{to{opacity:1;transform:none}}

/* ===== 名卡 ===== */
.ming-card{
  margin:18px 0;border:1.5px solid var(--ink);border-radius:4px;
  background:var(--paper3);position:relative;overflow:hidden;
}
.ming-card .top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ming-card .tagline{font-size:12px;letter-spacing:.18em;color:var(--ink2)}
.ming-card .wx-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);
}
.wx-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.wx-water{background:var(--water)} .wx-fire{background:var(--fire)}
.wx-wood{background:var(--wood)} .wx-metal{background:var(--metal)} .wx-earth{background:var(--earth)}
.ming-main{padding:22px 16px;text-align:center}
.ming-char{
  font-size:88px;font-weight:900;line-height:1;color:var(--ink);
  letter-spacing:.04em;position:relative;display:inline-block;
}
.ming-char .dui{
  position:absolute;top:-8px;right:-26px;font-size:13px;color:var(--ink2);
  writing-mode:vertical-rl;letter-spacing:.1em;font-weight:400;
}
.ming-pair{margin-top:12px;font-size:14px;color:var(--ink2)}
.ming-pair b{color:var(--ink)}
.xy-row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.xy-badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:3px;
  font-size:13px;font-weight:700;letter-spacing:.1em;
}
.xy-yang{background:var(--cinnabar);color:#F4EAD4}
.xy-yin{background:var(--fou);color:#E8E2D0}
.xy-pure{background:var(--earth);color:#F4EAD4}
.xy-badge small{font-weight:400;font-size:11px;opacity:.85}
.ming-def{
  margin:14px 16px 0;padding:12px 14px;background:rgba(227,213,184,.4);
  border-left:3px solid var(--line);font-size:14px;color:var(--ink2);line-height:2;
}
.ming-def b{color:var(--ink)}
.ming-note{margin:12px 16px 0;font-size:12px;color:var(--ink3);line-height:1.9}
.ming-actions{padding:16px}
.ming-actions .btn-main{margin-top:0}

/* ===== 变卡 ===== */
.bian-card{margin:18px 0;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper3);overflow:hidden}
.bian-card .top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.bian-card .tagline{font-size:12px;letter-spacing:.18em;color:var(--ink2);flex:none}
.ji-badge{padding:3px 12px;border-radius:3px;font-size:13px;font-weight:700;letter-spacing:.1em;color:#F4EAD4}
.ji-good{background:var(--good)} .ji-zang{background:var(--zang)} .ji-ping{background:var(--ping)}
.ji-fou{background:var(--fou)} .ji-xiong{background:var(--xiong)} .ji-none{background:var(--ink3)}
.bian-main{padding:20px 16px}
.bian-pos{font-size:56px;font-weight:900;color:var(--cinnabar);line-height:1;text-align:center}
.bian-pos .of{font-size:14px;color:var(--ink2);font-weight:400;letter-spacing:.1em}
.bian-ci{margin-top:16px;font-size:17px;color:var(--ink);line-height:2.1;text-align:center}
.bian-xiang{
  margin:14px 0 0;padding:12px 14px;background:rgba(227,213,184,.4);
  font-size:13.5px;color:var(--ink2);line-height:2;border-left:3px solid var(--line);
}
.bian-xy{margin-top:14px;padding:11px 14px;border-radius:4px;font-size:13px;line-height:1.9}
.bian-xy.xy-yang{background:rgba(168,58,42,.09);color:var(--cinnabar);border:1px dashed rgba(168,58,42,.4)}
.bian-xy.xy-yin{background:rgba(62,74,92,.09);color:var(--fou);border:1px dashed rgba(62,74,92,.4)}
.bian-actions{padding:16px}

/* ===== 不占提示 ===== */
.stop-card{
  margin:18px 0;border:1.5px solid var(--cinnabar);border-radius:4px;
  background:rgba(246,238,220,.6);padding:22px 18px;text-align:center;
}
.stop-card .s-char{font-size:52px;font-weight:900;color:var(--cinnabar)}
.stop-card .s-why{margin-top:10px;font-size:15px;color:var(--ink);font-weight:700}
.stop-card .s-note{margin-top:8px;font-size:13px;color:var(--ink2);line-height:1.9}
.stop-card .btn-main{margin-top:18px}

/* ===== 命图 ===== */
.map-head{margin:22px 0 4px;text-align:center}
.map-head .big{font-size:28px;font-weight:900;letter-spacing:.2em}
.map-head .note{font-size:12px;color:var(--ink2);margin-top:4px}
.map-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px;
}
.map-cell{
  border:1px solid var(--line);border-radius:4px;background:var(--paper3);
  padding:10px 4px 8px;text-align:center;cursor:pointer;transition:border-color .15s, background .15s;
  font-family:inherit;
}
.map-cell:active{border-color:var(--cinnabar);background:rgba(246,238,220,.8)}
.map-cell .mc-name{font-size:22px;font-weight:700;color:var(--ink);line-height:1.4}
.map-cell .mc-combo{font-size:10.5px;color:var(--ink3);margin-top:2px;letter-spacing:.04em}
.map-cell .mc-wx{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--ink2);margin-top:5px}
.map-cell .mc-wx .wx-dot{width:9px;height:9px}
.map-cell.no-var{border-style:dashed}
.map-cell.no-var .mc-name{color:var(--ink3)}
.map-cell.no-var::after{content:"无变";display:block;font-size:9px;color:var(--ink3);letter-spacing:.1em;margin-top:1px}

/* ===== 模态 ===== */
.mask{
  position:fixed;inset:0;background:rgba(30,25,16,.62);backdrop-filter:blur(2px);
  display:none;align-items:flex-end;justify-content:center;z-index:50;
}
.mask.on{display:flex;animation:fade .25s}
.sheet{
  background:var(--paper);width:100%;max-width:660px;max-height:88vh;overflow-y:auto;
  border-radius:10px 10px 0 0;padding:20px 18px 28px;position:relative;
  animation:sheetup .3s ease;
}
@keyframes sheetup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet-close{
  position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:transparent;color:var(--ink2);
  font-size:18px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;
}
.sheet-head{display:flex;align-items:baseline;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:10px}
.sheet-head .s-name{font-size:40px;font-weight:900}
.sheet-head .s-combo{font-size:14px;color:var(--ink2)}
.sheet-wx{margin-top:10px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.sheet-def{margin-top:10px;font-size:14px;color:var(--ink2);line-height:2;padding:10px 12px;background:rgba(227,213,184,.4);border-left:3px solid var(--line)}
.sheet-long{font-size:13.5px;color:var(--ink);line-height:2.1}
.sheet-pos-list{margin-top:16px}
.sheet-pos{
  padding:10px 2px;border-bottom:1px dashed var(--line);display:flex;gap:12px;align-items:flex-start;
}
.sheet-pos .p-no{font-size:18px;font-weight:700;color:var(--cinnabar);flex:none;width:26px;text-align:center}
.sheet-pos .p-body{flex:1}
.sheet-pos .p-ji{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:3px}
.sheet-pos .p-ci{font-size:14px;color:var(--ink)}
.sheet-pos .p-xiang{font-size:12.5px;color:var(--ink3);margin-top:3px}
.sheet-total{margin-top:14px;font-size:15px;color:var(--ink);line-height:2;padding:12px;background:rgba(168,58,42,.06);border:1px dashed rgba(168,58,42,.35);border-radius:4px}
.sheet-actions{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.sheet-actions .btn-main,.sheet-actions .btn-ghost{width:100%;margin-top:0}
.sheet-yi{margin-top:8px;color:var(--ink);font-size:13.5px;line-height:2;padding:8px 10px;background:rgba(47,79,107,.07);border-left:2px solid var(--water);border-radius:2px}
.rp-yi{margin-top:10px;color:var(--ink);font-size:13.5px;line-height:2;padding:8px 10px;background:rgba(47,79,107,.07);border-left:2px solid var(--water);border-radius:2px}
.ming-yi{margin-top:8px;color:var(--ink);font-size:13.5px;line-height:2;padding:8px 10px;background:rgba(47,79,107,.07);border-left:2px solid var(--water);border-radius:2px}
.hi-hint{font-size:11px;color:var(--ink3);letter-spacing:.08em}

/* ===== 底栏 ===== */
footer{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(239,229,207,.94);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);
}
.foot-inner{max-width:660px;margin:0 auto;display:flex;padding:8px 16px;gap:10px}
.foot-inner .btn-main{margin-top:0;padding:12px;font-size:15px;flex:1}
.foot-inner .btn-ghost{margin-top:0;padding:12px;font-size:15px;flex:1}
.foot-note{text-align:center;font-size:10.5px;color:var(--ink3);padding:4px 0 8px;letter-spacing:.06em}

/* ===== 蓍草舞台 ===== */
.stage-wrap{
  margin:16px 0 0;border:1px solid var(--line);border-radius:4px;
  background:linear-gradient(180deg,rgba(224,208,175,.55),rgba(246,238,220,.6));
  padding:10px 12px 12px;position:relative;
}
.stage-wrap::before{
  content:"";position:absolute;inset:4px;border:1px solid rgba(201,187,157,.55);
  border-radius:3px;pointer-events:none;
}
.stage-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:.18em;color:var(--ink2);margin-bottom:9px;position:relative;z-index:1}
.stage-virtual{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3);letter-spacing:.05em}
.v-stalks{display:flex;gap:2px}
.v-stalk{width:4px;height:13px;border:1px dashed var(--ink3);border-radius:1px;opacity:.65;background:transparent}
.stage-zone{display:flex;gap:10px;min-height:96px;position:relative;z-index:1}
.pile{
  flex:1;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;
  background:rgba(255,252,244,.35);border:1px dashed rgba(201,187,157,.7);
  border-radius:3px;padding:7px;min-height:110px;max-height:232px;overflow:hidden;
}
.pile-full{flex:1 1 100%}
.pile-empty{border-color:transparent;background:transparent}
.pile-empty::after{content:"—";color:var(--ink3);font-size:13px;margin:auto}
.stalk{
  width:4px;height:20px;border-radius:2px;flex:none;
  background:linear-gradient(180deg,#b08b55,#7a5b30);
  box-shadow:0 1px 0 rgba(110,81,40,.28);
}
.stalk.hung{background:linear-gradient(180deg,#c86a4e,#9a3a28)}
.grp{display:inline-flex;gap:3px;margin-right:8px}
.grp:last-child{margin-right:0}
.remain-tag{
  display:flex;align-items:center;font-size:11px;color:var(--cinnabar);
  margin-left:6px;letter-spacing:.04em;flex:none;font-weight:600;
}
.remain-tag::before{content:"";width:4px;height:20px;background:linear-gradient(180deg,#c86a4e,#9a3a28);border-radius:2px;margin-right:4px;display:inline-block}
.stage-info{
  margin-top:9px;font-size:13px;color:var(--ink);background:rgba(246,238,220,.75);
  border-radius:3px;padding:5px 10px;text-align:center;letter-spacing:.06em;
  border:1px solid rgba(201,187,157,.5);position:relative;z-index:1;
}
.stage-info b{color:var(--cinnabar)}

/* ===== 手动演蓍 ===== */
.mode-pick{display:flex;justify-content:center;gap:10px;margin:14px 0 18px}
.mode-btn{
  flex:1;max-width:176px;padding:10px 0;border:1px solid var(--line);
  background:transparent;color:var(--ink);border-radius:4px;
  font-size:13px;letter-spacing:.12em;cursor:pointer;font-family:inherit;
  transition:background .2s,color .2s;
}
.mode-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stage-actions{margin-top:9px;position:relative;z-index:1}
.stage-hint{font-size:12.5px;color:var(--cinnabar);text-align:center;letter-spacing:.06em;min-height:19px;line-height:1.5}
.stage-btns{display:flex;justify-content:center;gap:10px;margin-top:9px}
.btn-mini{
  padding:8px 20px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  border-radius:4px;font-size:13px;letter-spacing:.14em;cursor:pointer;font-family:inherit;
}
.btn-mini.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-mini:active{transform:scale(.97)}
.foot-mark{margin-top:3px;font-size:11px;letter-spacing:.1em;text-align:center;color:rgba(43,37,27,.5)}
.foot-mark a{color:var(--cinnabar);text-decoration:none;border-bottom:1px dotted var(--cinnabar);cursor:pointer;padding-bottom:1px;font-weight:600}
.foot-mark .mark-she{color:var(--water);font-weight:600;border-bottom:1px dotted var(--water);cursor:pointer;padding-bottom:1px}
.wx-num{letter-spacing:.12em;font-size:17px;color:var(--cinnabar)}
.pile.pickable .stalk{cursor:pointer}
.pile.pickable .stalk:hover{outline:1px solid var(--cinnabar);outline-offset:1px}
.grp.counted{margin-left:8px;opacity:.5}
.stalk.done{background:linear-gradient(180deg,#cfc5ad,#b3a88e);box-shadow:none}

.hidden{display:none!important}
.mono{font-variant-numeric:tabular-nums}
@media (min-width:700px){
  .mask{align-items:center}
  .sheet{border-radius:10px;max-height:82vh}
}

/* ===== 顶栏按钮 ===== */
.head-right{display:flex;align-items:center;gap:10px}
.theme-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s;
}
.theme-btn svg{fill:currentColor;stroke:currentColor;width:15px;height:15px}
.theme-btn:active{background:rgba(43,37,27,.08)}

/* ===== 返回 ===== */
.back-bar{margin:12px 0 0}
.back-btn{
  background:none;border:none;color:var(--ink2);font-size:14px;cursor:pointer;
  font-family:inherit;letter-spacing:.12em;padding:4px 2px;transition:color .2s;
}
.back-btn:hover{color:var(--cinnabar)}

/* ===== 记录视图 ===== */
.hist-head{margin:26px 0 18px;text-align:center}
.hist-head .big{font-size:26px;font-weight:900;letter-spacing:.14em}
.hist-head .note{font-size:12px;color:var(--ink2);margin-top:6px}
.hist-block{margin:16px 0;border:1px solid var(--line);border-radius:4px;background:rgba(246,238,220,.4);padding:12px 14px}
.hb-title{font-size:13px;letter-spacing:.2em;color:var(--cinnabar);font-weight:700;margin-bottom:8px;border-bottom:1px dashed var(--line);padding-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.hb-title .btn-mini{padding:4px 12px;font-size:12px}
.hist-item,.case-item{padding:10px 2px;border-bottom:1px dashed var(--line)}
.hist-item:last-child,.case-item:last-child{border-bottom:none}
.hi-top{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--ink3)}
.hi-state{color:var(--cinnabar)}
.hi-main{font-size:14px;margin-top:4px;line-height:1.9}
.hi-ji{color:var(--cinnabar);font-weight:700}
.hi-q{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.hi-actions{display:flex;gap:8px;margin-top:6px}
.hist-empty{padding:18px 0;text-align:center;font-size:13px;color:var(--ink3);letter-spacing:.1em}

/* ===== 结果新页 ===== */
.result-page{max-width:660px;margin:0 auto;padding:22px 20px 60px;min-height:100vh}
.rp-top{padding:4px 0;margin-bottom:4px}
.rp-brand{font-size:15px;letter-spacing:.4em;color:var(--cinnabar);text-align:center;margin-bottom:22px;font-weight:700}
.rp-head{text-align:center;border-bottom:1.5px solid var(--ink);padding-bottom:16px}
.rp-char{font-size:64px;font-weight:900;letter-spacing:.1em;line-height:1.2}
.rp-pair{font-size:13px;color:var(--ink2);letter-spacing:.16em;margin-top:8px}
.rp-mode{display:inline-block;margin:16px auto 4px;padding:4px 14px;border:1px solid var(--line);border-radius:3px;font-size:13px;letter-spacing:.14em;text-align:center}
.rp-mode.m-yang{color:var(--cinnabar);border-color:var(--cinnabar)}
.rp-mode.m-yin{color:var(--water);border-color:var(--water)}
.rp-mode.m-none{color:var(--ink3)}
.rp-time{text-align:center;font-size:12px;color:var(--ink3);margin:6px 0 2px}
.rp-verdict{display:flex;align-items:center;justify-content:center;gap:14px;margin:20px 0 8px}
.rp-pos{font-size:20px;font-weight:700}
.rp-ji{font-size:22px;font-weight:900;padding:3px 18px;border-radius:3px;color:#F4EAD4}
.rp-ci{font-size:16px;line-height:2.1;color:var(--ink);text-align:center;margin:12px auto}
.rp-xiang{font-size:13px;color:var(--ink2);text-align:center;line-height:1.9}
.rp-total{font-size:15px;line-height:2.1;color:var(--ink);text-align:center;margin:14px auto}
.rp-note{font-size:13px;color:var(--ink3);text-align:center;margin:12px auto;letter-spacing:.06em;line-height:1.9}
.rp-def{font-size:14px;line-height:2.1;color:var(--ink2);margin-top:20px;padding:12px 14px;background:rgba(227,213,184,.35);border-left:3px solid var(--line)}
body.dark .rp-def{background:rgba(255,255,255,.05)}
.rp-foot{text-align:center;font-size:11px;color:var(--ink3);letter-spacing:.1em;margin-top:32px}
.rp-card{background:rgba(227,213,184,.3);border:1px solid var(--line);border-radius:6px;padding:20px 16px 22px;margin-top:16px}
.rp-card-title{font-size:12px;letter-spacing:.34em;color:var(--ink3);text-align:center;margin-bottom:14px}
.rp-card .rp-char{font-size:56px}
.rp-char,.rp-ji-big{font-size:clamp(46px,15vw,64px)}
.rp-card .rp-mode{margin-top:14px}
.rp-card .rp-def{background:transparent;padding:10px 2px 0;border-left:none;margin-top:16px}
body.dark .rp-card{background:rgba(255,255,255,.05)}
.rp-ji-big{font-size:56px;font-weight:900;line-height:1.2;letter-spacing:.1em;margin:0 auto 6px}
.rp-ji-good{color:var(--cinnabar)}
.rp-ji-zang{color:#3F7A4A}
.rp-ji-ping{color:var(--ink2)}
.rp-ji-fou{color:var(--water)}
.rp-ji-xiong{color:#8E2B22}
.rp-divider{border-top:1.5px solid var(--line);margin:20px 4px 18px;position:relative}
.result-page{animation:fade .3s ease}
body.dark .rp-total{color:#D9CEB4}
body.dark .rp-def{color:#CFC4A8}
.rp-foot a.rp-mark{color:var(--cinnabar);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--cinnabar);cursor:pointer;padding-bottom:1px}
.rp-foot a.rp-she{color:var(--water);border-bottom-color:var(--water)}
.rp-actions{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.rp-actions .rp-row{display:flex;gap:12px}
.rp-actions .rp-row .btn-ghost{flex:1;margin-top:0}
.rp-actions .btn-ghost{margin-top:0}
.rp-actions .btn-main{margin-top:12px}

/* ===== 轻提示 ===== */

/* ===== 本轮新增：分区底色 · 显幽对照 · 大意 · 卦名跳转 · 搜索 · 棍子动画 ===== */
.rp-card-ming,.rp-card-bian{background:rgba(227,213,184,.4)}
.rp-card-bian{background:rgba(214,200,172,.32)}
body.dark .rp-card-ming{background:rgba(255,255,255,.07)}
body.dark .rp-card-bian{background:rgba(255,255,255,.04)}
.rp-char-link{cursor:pointer;transition:transform .15s,color .2s}
.rp-char-link:hover{transform:scale(1.03);color:var(--cinnabar)}
body.dark .rp-char-link:hover{color:#CC6F52}
.rp-dui{display:flex;gap:14px;justify-content:center;margin-top:14px;font-size:13px;letter-spacing:.18em}
.dui-item{color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:4px 12px}
.dui-item.on{color:var(--paper);background:var(--cinnabar);border-color:var(--cinnabar);font-weight:700}
body.dark .dui-item.on{background:#CC6F52;color:#1A1512}
.rp-dayi{margin-top:8px;font-size:13.5px;line-height:1.7;color:var(--ink2);background:rgba(246,238,220,.35);border-left:3px solid var(--line);padding:6px 10px}
body.dark .rp-dayi{background:rgba(255,255,255,.05);color:#CFC4A8}
.p-dayi{margin-top:5px;font-size:12.5px;color:var(--ink2);line-height:1.65}
body.dark .p-dayi{color:#CFC4A8}
.map-search{margin:4px auto 18px;max-width:340px}
.map-search input{width:100%;box-sizing:border-box;padding:9px 12px;font-size:16px;font-family:inherit;background:rgba(246,238,220,.5);border:1px solid var(--line);border-radius:4px;color:var(--ink);outline:none;text-align:center}
.map-search input:focus{border-color:var(--cinnabar)}
body.dark .map-search input{background:rgba(255,255,255,.06);color:#EDE3CE}
.pile{transition:opacity .3s ease,transform .3s ease;animation:pileIn .38s ease}
@keyframes pileIn{from{opacity:0;transform:scale(.975)}to{opacity:1;transform:scale(1)}}

/* ===== 复制勾选面板 ===== */
.copy-opts{padding:4px 2px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.copy-opt{display:flex;align-items:center;gap:9px;font-size:14.5px;letter-spacing:.04em;padding:10px 12px;background:rgba(246,238,220,.45);border:1px solid var(--line);border-radius:5px;cursor:pointer;user-select:none}
.copy-opt input{width:16px;height:16px;accent-color:var(--cinnabar);flex:none}
.copy-opt:has(input:checked){border-color:var(--cinnabar);background:rgba(168,58,42,.07)}
body.dark .copy-opt{background:rgba(255,255,255,.06)}
body.dark .copy-opt:has(input:checked){border-color:#CC6F52;background:rgba(204,111,82,.12)}

/* ===== 命图全文检索结果 ===== */
.map-hit{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;width:100%;box-sizing:border-box;text-align:left;padding:10px 14px;margin-bottom:10px;background:rgba(246,238,220,.45);border:1px solid var(--line);border-radius:5px;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s}
.map-hit:active{border-color:var(--cinnabar);background:rgba(168,58,42,.06)}
.map-hit .hit-name{font-size:20px;font-weight:700;color:var(--cinnabar);line-height:1.3}
.map-hit .hit-src{font-size:11px;color:var(--ink3);letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:1px 6px}
.map-hit .hit-text{font-size:13.5px;color:var(--ink2);line-height:1.7;width:100%}
.map-empty{padding:34px 10px;text-align:center;color:var(--ink3);font-size:14px;letter-spacing:.08em}
body.dark .map-hit{background:rgba(255,255,255,.06)}
body.dark .map-hit .hit-name{color:#CC6F52}
body.dark .map-hit .hit-text{color:#CFC4A8}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:4px;font-size:14px;letter-spacing:.14em;opacity:0;pointer-events:none;transition:all .3s;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 深色模式 ===== */
body.dark{
  --paper:#221D14;
  --paper2:#2C261B;
  --paper3:#292318;
  --ink:#E8DCBF;
  --ink2:#B5A78B;
  --ink3:#8B7F68;
  --line:#524734;
  --cinnabar:#CC6F52;
  --cinnabar2:#DE8A6C;
  --water:#7FA3C4;
  --fire:#CC6F52;
  --wood:#93B573;
  --metal:#A99F8E;
  --earth:#CBA65E;
  --good:#D97A5E;
  --zang:#93B573;
  --ping:#AC9E86;
  --fou:#94AACB;
  --xiong:#DDD0B5;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(204,111,82,.08), transparent 45%),
    radial-gradient(ellipse at 85% 100%, rgba(127,163,196,.07), transparent 45%),
    var(--paper);
}
body.dark .theme-btn:active{background:rgba(255,255,255,.08)}
body.dark .rules,body.dark .cast-log,body.dark .stop-card,body.dark .hist-block{background:rgba(255,255,255,.045)}
body.dark .ming-def,body.dark .ming-note,body.dark .sheet-def{background:rgba(255,255,255,.05)}
body.dark .map-cell:active{background:rgba(255,255,255,.08)}
body.dark footer{background:rgba(34,29,20,.94)}
body.dark .foot-mark{color:rgba(232,220,191,.5)}
body.dark .stage-wrap{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.05))}
body.dark .pile{background:rgba(0,0,0,.25);border-color:rgba(140,125,100,.5)}
body.dark .btn-ghost:active{background:rgba(255,255,255,.07)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <h1>潜虚</h1>
  </div>
  <div class="head-right">
    <button class="theme-btn" id="theme-btn" aria-label="切换深浅">
      <svg id="theme-icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="seal">潜虚</div>
  </div>
</header>
<div class="tabs">
  <button class="tab on" data-view="divine">潜虚</button>
  <button class="tab" data-view="map">命图</button>
  <button class="tab" data-view="hist">记录</button>
</div>

<!-- ===== 视图：演蓍 ===== -->
<section class="view on" id="view-divine">
  <div class="back-bar hidden" id="back-bar">
    <button class="back-btn" id="btn-back">‹ 返回</button>
  </div>
  <div id="divine-home">
    <div class="ask-box">
      <label for="question">所问何事（可以不填）</label>
      <input id="question" type="text" maxlength="40" placeholder="如：此行可否？此事如何？">
    </div>
    <div class="mode-pick">
      <button class="mode-btn on" id="mode-manual">演 卦</button>
      <button class="mode-btn" id="mode-auto">自动演示</button>
    </div>
    <button class="btn-main" id="btn-cast">起 卦</button>
  </div>

  <div id="divine-result" class="hidden">
    <div class="stage-wrap hidden" id="stage-ming">
      <div class="stage-head">
        <span>蓍 草 演 之</span>
        <span class="stage-virtual"><span class="v-stalks" id="virt-ming"></span>虚其五</span>
      </div>
      <div class="stage-zone">
        <div class="pile pile-left"></div>
        <div class="pile pile-right"></div>
      </div>
      <div class="stage-info" id="stageinfo-ming"></div>
      <div class="stage-actions" id="act-ming">
        <div class="stage-hint" id="hint-ming"></div>
        <div class="stage-btns" id="btns-ming"></div>
      </div>
    </div>
    <div class="cast-log" id="cast-log-ming">
      <h3>潜虚 · 定名</h3>
    </div>
    <div class="ming-card" id="ming-card">
      <div class="top">
        <span class="tagline" id="ming-tag">潜虚之名</span>
        <span class="wx-badge"><span class="wx-dot" id="ming-wxdot"></span><span id="ming-wx"></span></span>
      </div>
      <div class="ming-main">
        <span class="ming-char"><span id="ming-char">裒</span><span class="dui" id="ming-dui"></span></span>
        <div class="ming-pair" id="ming-pair"></div>
        <div class="xy-row" id="ming-xy"></div>
      </div>
      <div class="ming-def" id="ming-def"></div>
      <div class="ming-note" id="ming-note"></div>
      <div class="ming-actions">
        <button class="btn-main" id="btn-bian">求 变</button>
        <button class="btn-ghost" id="btn-again1">重新起卦</button>
      </div>
    </div>
  </div>

  <div id="bian-result" class="hidden">
    <div class="stage-wrap hidden" id="stage-bian">
      <div class="stage-head">
        <span>蓍 草 求 变</span>
        <span class="stage-virtual"><span class="v-stalks" id="virt-bian"></span>虚其五</span>
      </div>
      <div class="stage-zone">
        <div class="pile pile-left"></div>
        <div class="pile pile-right"></div>
      </div>
      <div class="stage-info" id="stageinfo-bian"></div>
      <div class="stage-actions" id="act-bian">
        <div class="stage-hint" id="hint-bian"></div>
        <div class="stage-btns" id="btns-bian"></div>
      </div>
    </div>
    <div class="cast-log" id="cast-log-bian">
      <h3>潜虚 · 求变</h3>
    </div>
    <div class="bian-card" id="bian-card">
      <div class="top">
        <span class="tagline" id="bian-tag"></span>
        <span class="ji-badge" id="bian-ji"></span>
      </div>
      <div class="bian-main">
        <div class="bian-pos"><span id="bian-pos">二</span><span class="of" id="bian-of"></span></div>
        <div class="bian-ci" id="bian-ci"></div>
        <div class="bian-xiang" id="bian-xiang"></div>
        <div class="bian-xy" id="bian-xy"></div>
      </div>
      <div class="bian-actions">
        <button class="btn-ghost" id="btn-save-case">存为案例</button>
        <button class="btn-main" id="btn-again3">重新起卦</button>
      </div>
    </div>
  </div>

  <div class="stop-card hidden" id="stop-card">
    <div class="s-char" id="stop-char">不占</div>
    <div class="s-why" id="stop-why"></div>
    <div class="s-note" id="stop-note"></div>
    <button class="btn-main" id="btn-again2">再 筮</button>
  </div>
</section>

<!-- ===== 视图：命图 ===== -->
<section class="view" id="view-map">
  <div class="map-head">
    <div class="big">潜 虚 命 图</div>
    <div class="note">五十五名 · 五行生成之数 · 点击查看名辞</div>
  </div>
  <div class="map-search"><input id="map-search" type="text" placeholder="搜索：卦名 / 数合 / 五行"></div>
  <div class="map-grid" id="map-grid"></div>
</section>

<!-- ===== 视图：记录 ===== -->
<section class="view" id="view-hist">
  <div class="hist-head">
    <div class="big">潜 虚 记 录</div>
    <div class="note">起卦自动留存 · 历史最多保留 100 条，超出自动清除最早记录</div>
  </div>
  <div class="hist-block">
    <div class="hb-title">案 例 <button class="btn-mini ghost" id="btn-clear-cases">清空</button></div>
    <div id="case-list"></div>
  </div>
  <div class="hist-block">
    <div class="hb-title">历史记录 <button class="btn-mini ghost" id="btn-clear-hist">清空</button></div>
    <div id="hist-list"></div>
  </div>
</section>

<!-- ===== 结果新页（hash 模式 / 出卦直接展示） ===== -->
<div class="result-page hidden" id="result-page">
  <div class="rp-top">
    <button class="back-btn" id="btn-rp-back">‹ 返回</button>
  </div>
  <div class="rp-body" id="rp-body"></div>
  <div class="rp-actions">
    <div class="rp-row">
      <button class="btn-ghost" id="btn-rp-copy">复制结果</button>
      <button class="btn-ghost hidden" id="btn-rp-case">存为案例</button>
    </div>
    <button class="btn-main" id="btn-rp-again">重新起卦</button>
  </div>
  <div class="rp-foot"><a class="rp-mark" id="rp-wx-link">随安制作</a> · <a class="rp-mark rp-she" id="rp-she-link">白渊国学社</a></div>
</div>
</div>

<div class="mask" id="mask">
  <div class="sheet" id="sheet"></div>
</div>

<footer>
